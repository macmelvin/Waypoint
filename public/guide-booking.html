<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waypoint — Book a Guided Walk</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, sans-serif;
    background: #FBF8F7; color: #1F2A2E; padding: 20px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; color: #1B3A4B; }
  .sub { color: #5C6A70; font-size: 14px; margin: 0 0 20px; }
  .card {
    background: #fff; border: 1px solid #E6DDCB; border-radius: 14px;
    padding: 18px; margin-bottom: 14px;
  }
  .slot-date { font-size: 13px; font-weight: 600; color: #C0783C; text-transform: uppercase; letter-spacing: 0.5px; margin: 14px 0 6px; }
  .slot-date:first-child { margin-top: 0; }
  .slot-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 8px; }
  .slot-btn {
    text-align: center; padding: 10px 6px; border-radius: 10px; border: 1px solid #E6DDCB;
    background: #fff; font-size: 13px; font-family: inherit; cursor: pointer; color: #1F2A2E;
  }
  .slot-btn:hover { background: #F1EAE0; }
  .slot-btn.selected { background: #1B3A4B; color: #FBF8F7; border-color: #1B3A4B; }
  input[type=text], textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #E6DDCB;
    background: #fff; color: #1F2A2E; font-size: 14px; margin-bottom: 10px; font-family: inherit;
  }
  button.primary {
    width: 100%; padding: 14px; border-radius: 10px; background: #1B3A4B; color: #FBF8F7;
    font-size: 15px; font-weight: 600; border: none; cursor: pointer;
  }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty { color: #8A97A0; font-size: 14px; text-align: center; padding: 20px 0; }
  #error { color: #b91c1c; font-size: 13px; margin-top: 8px; }
  .confirm-box { text-align: center; padding: 30px 20px; }
  .confirm-icon { font-size: 36px; }
  .stars { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
  .star-btn {
    background: none; border: none; font-size: 28px; line-height: 1; cursor: pointer;
    color: #d8dadd; padding: 2px; font-family: inherit;
  }
  .star-btn.filled { color: #f5b942; }
  #feedbackError { color: #b91c1c; font-size: 13px; margin-top: 8px; }
  #feedbackThanks { text-align: center; padding: 10px 0; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="card"><div class="empty">Loading availability…</div></div>
  <div id="content" style="display:none">
    <h1 id="guideName"></h1>
    <p class="sub" id="guideSpecialty"></p>
    <div id="priceBanner" style="display:none;background:#F1EAE0;border:1px solid #E6DDCB;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px;color:#1B3A4B;font-weight:600"></div>

    <div class="card" id="slotsCard">
      <div id="slotList"></div>
    </div>

    <div class="card" id="formCard" style="display:none">
      <div style="font-weight:600;margin-bottom:10px">Your details</div>
      <input type="text" id="nameInput" placeholder="Your name">
      <input type="text" id="phoneInput" placeholder="Phone number (e.g. 91234567)">
      <div style="display:flex;gap:10px">
        <div style="flex:1">
          <label style="display:block;font-size:12px;color:#5C6A70;margin-bottom:4px">Adults (15+)</label>
          <input type="text" inputmode="numeric" id="adultsInput" value="1" oninput="updateEstimate()">
        </div>
        <div style="flex:1">
          <label style="display:block;font-size:12px;color:#5C6A70;margin-bottom:4px">Children (under 15)</label>
          <input type="text" inputmode="numeric" id="childrenInput" value="0" oninput="updateEstimate()">
        </div>
      </div>
      <div id="estimateLine" style="font-size:13px;color:#5C6A70;margin:-4px 0 10px"></div>
      <textarea id="noteInput" placeholder="Anything the guide should know? (optional)" rows="2"></textarea>
      <button class="primary" id="submitBtn" onclick="submitBooking()">Request this slot</button>
      <div id="error"></div>
    </div>

    <div class="card confirm-box" id="confirmCard" style="display:none">
      <div class="confirm-icon">✓</div>
      <div style="font-weight:600;margin-top:8px">Request sent</div>
      <div class="sub" style="margin-top:6px">The guide will confirm within 24 hours. This is an enquiry, not an instant booking.</div>
    </div>

    <!-- Shown as soon as the guide's details load, independent of whether a
         slot has been booked on this particular page load -- this link
         still works even if the guide's card isn't in today's rotating
         batch on the main map (see MAX_GUIDES_PER_LANDMARK in server.js),
         so a visitor returning after their walk (same day or any later day)
         can always reach it from this same URL. -->
    <div class="card" id="feedbackCard" style="display:none">
      <div style="font-weight:600;margin-bottom:4px">How was it?</div>
      <p class="sub" style="margin:0 0 14px">Already been on a walk with <strong id="feedbackGuideName"></strong>? Leave feedback below — any time, no need to wait for anything else.</p>
      <div id="feedbackStars" class="stars">
        <button type="button" class="star-btn" data-star="1" onclick="selectFeedbackStar(1)">★</button>
        <button type="button" class="star-btn" data-star="2" onclick="selectFeedbackStar(2)">★</button>
        <button type="button" class="star-btn" data-star="3" onclick="selectFeedbackStar(3)">★</button>
        <button type="button" class="star-btn" data-star="4" onclick="selectFeedbackStar(4)">★</button>
        <button type="button" class="star-btn" data-star="5" onclick="selectFeedbackStar(5)">★</button>
      </div>
      <textarea id="feedbackComment" placeholder="Tell us about your guided walk (optional)" rows="3"></textarea>
      <button class="primary" id="feedbackSubmitBtn" onclick="submitFeedback()">Submit feedback</button>
      <div id="feedbackError"></div>
      <div id="feedbackThanks" style="display:none">🙏 Thanks for your feedback!</div>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const guideId = params.get('guide') || '';
const landmarkKey = params.get('landmark') || '';
let slots = [];
let selectedSlot = null;
let pricePerAdult = 0;

function updateEstimate() {
  const adults = Math.max(0, parseInt(document.getElementById('adultsInput').value, 10) || 0);
  const children = Math.max(0, parseInt(document.getElementById('childrenInput').value, 10) || 0);
  const line = document.getElementById('estimateLine');
  if (!pricePerAdult) { line.textContent = ''; return; }
  const total = adults * pricePerAdult;
  line.textContent = `Estimated: S$${total.toFixed(2)} (S$${pricePerAdult.toFixed(2)}/adult${children ? ', children under 15 free' : ''}) — confirmed with your guide directly, no payment taken here.`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function formatDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
}

async function load() {
  if (!guideId) { showEmpty('Missing guide.'); return; }
  try {
    const res = await fetch(`/api/guides/${encodeURIComponent(guideId)}/available-slots${landmarkKey ? `?landmark=${encodeURIComponent(landmarkKey)}` : ''}`);
    const data = await res.json();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    if (!data.guide) { showEmpty("This guide isn't currently bookable."); return; }
    document.getElementById('guideName').textContent = data.guide.name;
    document.getElementById('guideSpecialty').textContent = data.guide.specialty || '';
    document.getElementById('feedbackGuideName').textContent = data.guide.name;
    document.getElementById('feedbackCard').style.display = 'block';
    slots = data.slots || [];
    pricePerAdult = Number(data.pricePerAdult) || 0;
    const banner = document.getElementById('priceBanner');
    if (pricePerAdult) {
      banner.textContent = `S$${pricePerAdult.toFixed(2)} per adult · children under 15 free`;
      banner.style.display = 'block';
    }
    renderSlots();
    updateEstimate();
  } catch (err) {
    document.getElementById('loading').textContent = 'Could not load availability — please try again.';
  }
}

function showEmpty(msg) {
  document.getElementById('slotList').innerHTML = `<div class="empty">${escapeHtml(msg)}</div>`;
}

function renderSlots() {
  const list = document.getElementById('slotList');
  if (!slots.length) {
    list.innerHTML = '<div class="empty">No upcoming availability right now — check back soon, or message the guide directly from the app.</div>';
    return;
  }
  let lastDate = null;
  let html = '';
  let rowOpen = false;
  slots.forEach((s, i) => {
    if (s.date !== lastDate) {
      if (rowOpen) html += '</div>';
      html += `<div class="slot-date">${formatDate(s.date)}</div><div class="slot-row">`;
      lastDate = s.date;
      rowOpen = true;
    }
    html += `<button type="button" class="slot-btn" data-i="${i}" onclick="selectSlot(${i})">${s.start} – ${s.end}</button>`;
  });
  if (rowOpen) html += '</div>';
  list.innerHTML = html;
}

function selectSlot(i) {
  selectedSlot = slots[i];
  document.querySelectorAll('.slot-btn').forEach((b) => b.classList.toggle('selected', Number(b.dataset.i) === i));
  document.getElementById('formCard').style.display = 'block';
  document.getElementById('formCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function submitBooking() {
  const errorEl = document.getElementById('error');
  errorEl.textContent = '';
  if (!selectedSlot) { errorEl.textContent = 'Pick a time slot first.'; return; }
  const visitorName = document.getElementById('nameInput').value.trim();
  const visitorPhone = document.getElementById('phoneInput').value.trim();
  const adults = Math.max(1, parseInt(document.getElementById('adultsInput').value, 10) || 1);
  const children = Math.max(0, parseInt(document.getElementById('childrenInput').value, 10) || 0);
  const note = document.getElementById('noteInput').value.trim();
  if (!visitorName) { errorEl.textContent = 'Your name is required.'; return; }
  if (!visitorPhone) { errorEl.textContent = 'Your phone number is required.'; return; }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  try {
    const res = await fetch(`/api/guides/${encodeURIComponent(guideId)}/book`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: selectedSlot.date, start: selectedSlot.start, end: selectedSlot.end, visitorName, visitorPhone, adults, children, note, landmark: landmarkKey }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      errorEl.textContent = body.error || `HTTP ${res.status}`;
      if (res.status === 409) { await load(); document.getElementById('formCard').style.display = 'none'; }
      btn.disabled = false;
      return;
    }
    document.getElementById('slotsCard').style.display = 'none';
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('confirmCard').style.display = 'block';
  } catch (err) {
    errorEl.textContent = 'Something went wrong — please try again.';
    btn.disabled = false;
  }
}

// ---- Feedback (independent of the booking flow above -- see the
// feedbackCard comment in the HTML for why this lives on this page). Posts
// to the same POST /api/guides/:id/feedback endpoint the main app's guide
// cards use (see app.js's renderGuidesSection / openGuideFeedbackModal), so
// a comment left from here shows up in /admin exactly the same way.
let feedbackRating = 0;

function selectFeedbackStar(n) {
  feedbackRating = n;
  document.querySelectorAll('.star-btn').forEach((btn) => {
    btn.classList.toggle('filled', Number(btn.dataset.star) <= feedbackRating);
  });
}

async function submitFeedback() {
  const errorEl = document.getElementById('feedbackError');
  errorEl.textContent = '';
  if (feedbackRating < 1) { errorEl.textContent = 'Please select a star rating.'; return; }
  const btn = document.getElementById('feedbackSubmitBtn');
  btn.disabled = true;
  try {
    const res = await fetch(`/api/guides/${encodeURIComponent(guideId)}/feedback`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rating: feedbackRating, comment: document.getElementById('feedbackComment').value }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || 'Something went wrong — please try again.');
    }
    document.getElementById('feedbackStars').style.display = 'none';
    document.getElementById('feedbackComment').style.display = 'none';
    btn.style.display = 'none';
    document.getElementById('feedbackThanks').style.display = 'block';
  } catch (err) {
    errorEl.textContent = err.message;
    btn.disabled = false;
  }
}

load();
</script>
</body>
</html>
