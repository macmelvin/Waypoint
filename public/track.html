<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Live location — Waypoint SOS</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🆘</text></svg>" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { display: flex; flex-direction: column; background: #fff; }
  header {
    padding: 12px 16px;
    background: #dc2626;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  header .icon { font-size: 22px; }
  header .titles { line-height: 1.3; }
  header .titles h1 { margin: 0; font-size: 15px; font-weight: 700; }
  header .titles p { margin: 0; font-size: 12px; opacity: 0.9; }
  #map { flex: 1; min-height: 0; }
  #statusBar {
    padding: 10px 16px;
    font-size: 12.5px;
    color: #444;
    background: #fafafa;
    border-top: 1px solid #e5e7eb;
    flex-shrink: 0;
  }
  #statusBar.stale { color: #b45309; }
  #statusBar.expired { color: #b91c1c; font-weight: 600; }
  #centerMsg {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    background: #fff;
  }
  #centerMsg.show { display: flex; }
  #centerMsg .box { max-width: 320px; }
  #centerMsg .box .emoji { font-size: 40px; margin-bottom: 10px; }
  #centerMsg .box p { color: #555; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <span class="icon">🆘</span>
  <div class="titles">
    <h1 id="headerTitle">Live location</h1>
    <p id="headerSubtitle">via Waypoint SOS</p>
  </div>
</header>

<div id="map"></div>
<div id="statusBar">Loading…</div>

<div id="centerMsg">
  <div class="box">
    <div class="emoji">📍</div>
    <p id="centerMsgText">Loading this location…</p>
  </div>
</div>

<script>
(function () {
  const sessionId = window.location.pathname.split('/').filter(Boolean).pop();
  const POLL_MS = 5000;

  const statusBar = document.getElementById('statusBar');
  const headerTitle = document.getElementById('headerTitle');
  const centerMsg = document.getElementById('centerMsg');
  const centerMsgText = document.getElementById('centerMsgText');

  function showCenterMessage(text) {
    centerMsgText.textContent = text;
    centerMsg.classList.add('show');
  }
  function hideCenterMessage() {
    centerMsg.classList.remove('show');
  }

  function timeAgo(ms) {
    const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 60) return `${s}s ago`;
    const m = Math.round(s / 60);
    if (m < 60) return `${m}min ago`;
    return `${Math.round(m / 60)}hr ago`;
  }

  let map = null;
  let marker = null;
  let accuracyCircle = null;
  let pollTimer = null;
  let everLoaded = false;

  function ensureMap(lat, lon) {
    if (map) return;
    map = L.map('map').setView([lat, lon], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19,
    }).addTo(map);
    marker = L.marker([lat, lon]).addTo(map);
  }

  function update(data) {
    everLoaded = true;
    hideCenterMessage();
    ensureMap(data.lat, data.lon);
    marker.setLatLng([data.lat, data.lon]);
    map.panTo([data.lat, data.lon]);
    if (data.senderName) headerTitle.textContent = `Live location — ${data.senderName}`;

    const ageMs = Date.now() - data.updatedAt;
    statusBar.classList.remove('stale', 'expired');
    if (ageMs > 3 * 60 * 1000) {
      statusBar.classList.add('stale');
      statusBar.textContent = `⚠️ Last update ${timeAgo(data.updatedAt)} — location may be out of date.`;
    } else {
      statusBar.textContent = `Updated ${timeAgo(data.updatedAt)}`;
    }
  }

  function showExpired() {
    statusBar.classList.add('expired');
    statusBar.textContent = 'This live location is no longer being shared.';
    if (!everLoaded) {
      showCenterMessage('This live location link has expired or the person has stopped sharing. If this is an emergency, contact them directly or call 999.');
    } else {
      showCenterMessage('Live sharing has ended. This was the last known location.');
    }
    clearInterval(pollTimer);
  }

  async function poll() {
    try {
      const res = await fetch(`/api/sos-track/${encodeURIComponent(sessionId)}`);
      if (res.status === 404) { showExpired(); return; }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      update(data);
    } catch (err) {
      console.error('track poll failed:', err);
      if (!everLoaded) showCenterMessage('Could not load this location right now. Retrying…');
    }
  }

  if (!sessionId) {
    showCenterMessage('This link is missing a location ID.');
  } else {
    poll();
    pollTimer = setInterval(poll, POLL_MS);
  }
})();
</script>

</body>
</html>
